[package]
name = "aica-tauri-pilot"
version = "1.0.0"
description = "AICA Tauri native pilot"
authors = ["AIConsumerAgent Team"]
edition = "2021"
rust-version = "1.88.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "4.2", features = ["v1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
zeroize = "1"
